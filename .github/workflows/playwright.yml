name: TestYard Playwright CI

# Trigger the pipeline on pushes, pull requests, or manually.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to read repository contents.
permissions:
  contents: read

jobs:
  e2e-tests:
    name: Cross-Browser Regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # Our Node.js project is inside the playwright-ts folder.
    defaults:
      run:
        working-directory: playwright-ts

    # Enable CI-specific settings in playwright.config.ts.
    env:
      CI: 'true'

    steps:
      # Download our repository onto the GitHub runner.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Use Node.js 26, matching our local development environment.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: playwright-ts/package-lock.json

      # Install the exact dependencies from package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Install all three browsers and required Linux libraries.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Execute our existing authentication test on all browser projects.
      - name: Run authentication regression
        run: npx playwright test tests/auth.spec.ts --workers=1

      # Preserve the HTML report even when the tests fail.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-html-report
          path: playwright-ts/playwright-report/
          retention-days: 14
          if-no-files-found: warn